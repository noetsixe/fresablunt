<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fresa Blunt</title>

    <meta
        name="description"
        content="Fresa Blunt — música, visuales y universo artístico."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         INTRO
    ====================================== -->

    <main id="intro">

        <!-- Fondo de la intro -->
        <div id="intro-background"></div>

        <!-- Fresa central -->
       <button id="strawberry" aria-label="Entrar al mundo de Fresa Blunt">
    🍓
</button>

        <!-- =================================
             BLUNT QUE CAE
        ================================== -->

        <div id="blunt">

            <div class="blunt-paper"></div>
            <div class="blunt-tip"></div>

        </div>


        <!-- =================================
             IMPACTO
        ================================== -->

        <div id="impact">

            <div class="impact-flash"></div>

            <div class="juice juice-1"></div>
            <div class="juice juice-2"></div>
            <div class="juice juice-3"></div>
            <div class="juice juice-4"></div>
            <div class="juice juice-5"></div>

        </div>


        <!-- Pantalla para la transición -->
        <div id="transition"></div>

    </main>


    <!-- =====================================
         PÁGINA PRINCIPAL
    ====================================== -->

    <main id="main-site">

        <header>

            <a href="/" class="logo">
                FRESA BLUNT
            </a>

            <nav>
                <a href="#music">MUSIC</a>
                <a href="#visuals">VISUALS</a>
                <a href="#about">ABOUT</a>
                <a href="/press/">PRESS</a>
                <a href="/industry/">INDUSTRY</a>
            </nav>

        </header>


        <!-- HERO -->

        <section class="hero" id="home">

            <div class="hero-content">

                <p class="eyebrow">
                    FRESA BLUNT
                </p>

                <h1>
                    WELCOME
                </h1>

                <p>
                    Enter the world.
                </p>

            </div>

        </section>


        <!-- MUSIC -->

        <section id="music">

            <h2>MUSIC</h2>

        </section>


        <!-- VISUALS -->

        <section id="visuals">

            <h2>VISUALS</h2>

        </section>


        <!-- ABOUT -->

        <section id="about">

            <h2>ABOUT</h2>

        </section>


        <!-- FOOTER -->

        <footer>

            <p>
                © FRESA BLUNT
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
